  <text x="100" y="210" font-family="Arial, sans-serif" font-size="17" fill="#475569">This is a mock reference file used by the Phase 1 frontend.</text>
  <line x1="100" y1="240" x2="800" y2="240" stroke="#e2e8f0" stroke-width="2"/>
  <text x="100" y="290" font-family="Arial, sans-serif" font-size="18" fill="#334155">Instructions</text>
  <text x="100" y="325" font-family="Arial, sans-serif" font-size="16" fill="#64748b">1. Read the assessment brief carefully.</text>
  <text x="100" y="360" font-family="Arial, sans-serif" font-size="16" fill="#64748b">2. Compare the student submission against this reference.</text>
  <text x="100" y="395" font-family="Arial, sans-serif" font-size="16" fill="#64748b">3. Record marks and feedback in the grading panel.</text>
